<!DOCTYPE html>

<html lang="pt-BR">

<head>
<meta charset="UTF-8"/>
<title>Exemplo 2 Functions</title>
</head>

<body>

<script>
	function soma(valor1, valor2){
		alert("O resultado da soma de " + valor1 + " com " + valor2 + " é igual a " + Number(valor1+valor2));
	};
	
	/* 	soma(13, 63);
		soma(0, 128);
		soma(57, 1234); */
	
	var n1, n2;
	n1 = prompt("Digite o 1 valor");
	n1 = Number(n1);
	n2 = prompt("Digite o 2 valor");
	n2 = Number(n2);
	soma(n1, n2);
	
	document.write("A função document.write é exibida após a execução do JavaScript.");
	
	alert("Alert teste");

</script>

</script>

</body>
