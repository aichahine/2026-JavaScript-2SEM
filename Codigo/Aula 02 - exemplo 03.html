<body>

<script>
	function multiplicacao(valor1, valor2){
		alert("Agora farei a multiplicação");
	return(Number(valor1 * valor2));
	};
	
	var num1, num2;
	num1 = prompt("Digite o 1 valor");
	num1 = Number(num1);
	num2 = prompt("Digite o 2 valor");
	num2 = Number(num2);
	alert("Multiplicação de " + num1 + " por " + num2 + " é igual a " + multiplicacao(num1, num2));

</script>
